name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/setup@v1
        with:
          runtime: node@26
          cache: true
          install: false
      - run: pnpm install --frozen-lockfile
      # The public address, used for canonical links, social previews and the sitemap.
      # Default: https://<owner>.github.io. For a custom domain, set a repository
      # variable named SITE_URL (Settings → Secrets and variables → Actions → Variables).
      - name: Set site address
        env:
          CUSTOM_URL: ${{ vars.SITE_URL }}
        run: |
          OWNER="${GITHUB_REPOSITORY_OWNER,,}"
          echo "VITE_SITE_URL=${CUSTOM_URL:-https://$OWNER.github.io}" >> "$GITHUB_ENV"
      - run: pnpm build
      - run: cp dist/client/index.html dist/client/404.html
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist/client

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5.0.1